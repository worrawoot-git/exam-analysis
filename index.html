<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ระบบวิเคราะห์ข้อสอบ (Item Analysis)</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (แปลง JSX ใน browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Sarabun', sans-serif; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #a5b4fc; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #6366f1; }

    /* Sticky shadow */
    .shadow-r { box-shadow: 4px 0 6px -2px rgba(0,0,0,0.08); }

    /* Fade-in animation */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeInUp 0.35s ease both; }

    /* Modal zoom */
    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }
    .animate-zoom-in { animation: zoomIn 0.2s ease both; }

    /* Input number hide arrows */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    /* Print style */
    @media print {
      .no-print { display: none !important; }
      body { background: white; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    /* ── Inline SVG Icons ── */
    const Icon = {
      Calculator: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect width="16" height="20" x="4" y="2" rx="2"/>
          <line x1="8" x2="16" y1="6" y2="6"/>
          <line x1="16" x2="16" y1="14" y2="18"/>
          <path d="M16 10h.01M12 10h.01M8 10h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01"/>
        </svg>
      ),
      Settings: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      ),
      Reset: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
      ),
      Chart: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>
        </svg>
      ),
      Plus: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M5 12h14M12 5v14"/>
        </svg>
      ),
      Trash: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
        </svg>
      ),
      Download: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" x2="12" y1="15" y2="3"/>
        </svg>
      ),
      Warn: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
          <path d="M12 9v4M12 17h.01"/>
        </svg>
      ),
    };

    /* ── Stat Card ── */
    const StatCard = ({ title, value, desc, color = "indigo", highlight = null }) => {
      const borderMap = {
        indigo: highlight === true  ? "border-l-emerald-500"
               : highlight === false ? "border-l-red-400"
               : "border-l-indigo-500",
        green: "border-l-emerald-500",
        red:   "border-l-red-400",
        blue:  "border-l-blue-500",
      };
      const valColor = highlight === true ? "text-emerald-600"
                     : highlight === false ? "text-red-500"
                     : "text-gray-800";
      return (
        <div className={`bg-white rounded-xl p-5 shadow-sm border border-gray-100 border-l-4 ${borderMap[color]} flex flex-col gap-1`}>
          <span className="text-xs font-semibold text-gray-400 uppercase tracking-wide">{title}</span>
          <span className={`text-3xl font-bold ${valColor}`}>{value}</span>
          <span className="text-xs text-gray-400">{desc}</span>
        </div>
      );
    };

    /* ══════════════════════════════════════
       MAIN APP
    ══════════════════════════════════════ */
    const App = () => {
      /* --- State: Metadata --- */
      const [meta, setMeta] = useState({
        subjectName: '',
        subjectCode: '',
        instructor: '',
        semester: '1',
        year: new Date().getFullYear() + 543,
      });

      /* --- State: Config --- */
      const [config, setConfig] = useState({ numQuestions: 10, numChoices: 4 });

      /* --- State: Data --- */
      const [keyAnswers, setKeyAnswers] = useState(Array(10).fill(''));
      const [students, setStudents] = useState([]);
      const [results, setResults] = useState(null);

      /* --- State: UI --- */
      const [showClearDialog, setShowClearDialog] = useState(false);
      const [toast, setToast] = useState(null);  // { msg, type }

      /* Toast helper */
      const showToast = (msg, type = "error") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      /* Init students */
      useEffect(() => {
        setStudents(
          Array.from({ length: 10 }, (_, i) => ({
            id: Date.now() + i,
            name: `นักเรียนคนที่ ${i + 1}`,
            answers: Array(10).fill(''),
          }))
        );
      }, []);

      /* ── Config change ── */
      const handleConfigChange = (field, raw) => {
        const val = parseInt(raw) || 0;
        if (val < 1) return;
        setConfig(prev => ({ ...prev, [field]: val }));

        if (field === 'numQuestions') {
          setKeyAnswers(prev => {
            if (val > prev.length) return [...prev, ...Array(val - prev.length).fill('')];
            return prev.slice(0, val);
          });
          setStudents(prev => prev.map(s => {
            const a = [...s.answers];
            if (val > a.length) return { ...s, answers: [...a, ...Array(val - a.length).fill('')] };
            return { ...s, answers: a.slice(0, val) };
          }));
        }
      };

      const handleKeyChange = (i, v) => {
        const k = [...keyAnswers];
        k[i] = v.slice(-1);        // เก็บแค่ 1 ตัวอักษร
        setKeyAnswers(k);
      };

      const handleStudentChange = (sIdx, type, value, qIdx = null) => {
        setStudents(prev => {
          const ns = [...prev];
          if (type === 'name') {
            ns[sIdx] = { ...ns[sIdx], name: value };
          } else {
            const ans = [...ns[sIdx].answers];
            ans[qIdx] = value.slice(-1);
            ns[sIdx] = { ...ns[sIdx], answers: ans };
          }
          return ns;
        });
      };

      const addStudentRow = () => {
        setStudents(prev => [
          ...prev,
          {
            id: Date.now(),
            name: `นักเรียนคนที่ ${prev.length + 1}`,
            answers: Array(config.numQuestions).fill(''),
          },
        ]);
      };

      const removeStudentRow = idx => {
        setStudents(prev => prev.filter((_, i) => i !== idx));
      };

      /* ── Calculate ── */
      const calculateResults = () => {
        const active = students.filter(s =>
          s.answers.some(a => a !== null && a.trim() !== '')
        );
        if (active.length === 0) {
          showToast("กรุณากรอกข้อมูลคำตอบของนักเรียนอย่างน้อย 1 คน", "error");
          return;
        }

        const N = active.length;
        const K = config.numQuestions;

        const scored = active.map(s => {
          let score = 0;
          const itemScores = s.answers.map((ans, idx) => {
            const ok = ans && keyAnswers[idx] && ans.trim() === keyAnswers[idx].trim();
            if (ok) score++;
            return ok ? 1 : 0;
          });
          return { ...s, score, itemScores };
        });

        const scores = scored.map(s => s.score);
        const sumX  = scores.reduce((a, b) => a + b, 0);
        const sumX2 = scores.reduce((a, b) => a + b * b, 0);
        const mean  = sumX / N;
        const variance = (sumX2 - (sumX * sumX) / N) / N;
        const sd   = Math.sqrt(variance);

        const sorted = [...scored].sort((a, b) => b.score - a.score);
        const split  = Math.max(1, Math.ceil(N * 0.27));
        const upper  = sorted.slice(0, split);
        const lower  = sorted.slice(N - split);

        let sumPQ = 0;
        const items = Array.from({ length: K }, (_, i) => {
          const correct = scored.filter(s => s.itemScores[i] === 1).length;
          const p = correct / N;
          const q = 1 - p;
          sumPQ += p * q;

          const uC = upper.filter(s => s.itemScores[i] === 1).length;
          const lC = lower.filter(s => s.itemScores[i] === 1).length;
          const r  = split > 0 ? (uC - lC) / split : 0;

          const difficultyMeaning =
            p < 0.20 ? "ยากมาก" :
            p < 0.40 ? "ค่อนข้างยาก" :
            p < 0.60 ? "ปานกลาง" :
            p < 0.80 ? "ค่อนข้างง่าย" : "ง่ายมาก";

          const discriminationMeaning =
            r >= 0.40 ? "จำแนกได้ดีมาก" :
            r >= 0.30 ? "จำแนกได้ดี" :
            r >= 0.20 ? "จำแนกได้พอใช้" : "ควรปรับปรุง";

          return {
            id: i + 1,
            p: p.toFixed(2),
            r: r.toFixed(2),
            difficultyMeaning,
            discriminationMeaning,
          };
        });

        const kr20 = (variance > 0 && K > 1)
          ? (K / (K - 1)) * (1 - sumPQ / variance) : 0;
        const kr21 = (variance > 0 && K > 1)
          ? (K / (K - 1)) * (1 - (mean * (K - mean)) / (K * variance)) : 0;

        setResults({
          basic: {
            count: N, fullScore: K,
            mean: mean.toFixed(2), sd: sd.toFixed(2),
            max: Math.max(...scores), min: Math.min(...scores),
            kr20: kr20.toFixed(3), kr21: kr21.toFixed(3),
          },
          items,
          scoredStudents: scored,
        });

        showToast("วิเคราะห์ข้อมูลสำเร็จ! ✓", "success");

        // Scroll to results
        setTimeout(() => {
          document.getElementById('results-section')?.scrollIntoView({ behavior: 'smooth' });
        }, 100);
      };

      /* ── Clear ── */
      const confirmClear = () => {
        setKeyAnswers(Array(config.numQuestions).fill(''));
        setStudents(prev => prev.map(s => ({ ...s, answers: Array(config.numQuestions).fill('') })));
        setResults(null);
        setShowClearDialog(false);
        showToast("ล้างข้อมูลเรียบร้อยแล้ว", "success");
      };

      /* ── Export Excel ── */
      const exportToExcel = () => {
        if (!results) { showToast("กรุณาวิเคราะห์ข้อมูลก่อนส่งออก"); return; }

        const th = 'border:1px solid #aaa;background:#e8eaf6;padding:6px 10px;font-weight:600;text-align:center;';
        const td = 'border:1px solid #ccc;padding:5px 10px;text-align:center;';

        let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office"
          xmlns:x="urn:schemas-microsoft-com:office:excel"
          xmlns="http://www.w3.org/TR/REC-html40">
          <head><meta charset="UTF-8">
          <!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets>
          <x:ExcelWorksheet><x:Name>รายงาน</x:Name></x:ExcelWorksheet>
          </x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
          </head><body>`;

        html += `<h2 style="text-align:center">รายงานผลการวิเคราะห์ข้อสอบ</h2>`;
        html += `<p>วิชา: ${meta.subjectName} (${meta.subjectCode}) | อาจารย์: ${meta.instructor} | ภาคเรียน ${meta.semester}/${meta.year}</p><br>`;

        // Summary
        html += `<b>1. สรุปผล (Summary Statistics)</b><br>
        <table style="border-collapse:collapse">
          <tr><th style="${th}">Mean</th><th style="${th}">SD</th><th style="${th}">KR-20</th>
              <th style="${th}">KR-21</th><th style="${th}">Max</th><th style="${th}">Min</th><th style="${th}">N</th></tr>
          <tr><td style="${td}">${results.basic.mean}</td><td style="${td}">${results.basic.sd}</td>
              <td style="${td}">${results.basic.kr20}</td><td style="${td}">${results.basic.kr21}</td>
              <td style="${td}">${results.basic.max}</td><td style="${td}">${results.basic.min}</td>
              <td style="${td}">${results.basic.count}</td></tr>
        </table><br>`;

        // Item analysis
        html += `<b>2. วิเคราะห์รายข้อ (Item Analysis)</b><br>
        <table style="border-collapse:collapse">
          <tr>
            <th style="${th}">ข้อที่</th><th style="${th}">ค่าความยาก (p)</th><th style="${th}">ความหมาย</th>
            <th style="${th}">อำนาจจำแนก (r)</th><th style="${th}">ความหมาย</th><th style="${th}">สรุป</th>
          </tr>`;
        results.items.forEach(item => {
          const pass = parseFloat(item.p) >= 0.2 && parseFloat(item.p) <= 0.8 && parseFloat(item.r) >= 0.2;
          html += `<tr>
            <td style="${td}">${item.id}</td>
            <td style="${td}">${item.p}</td>
            <td style="${td}">${item.difficultyMeaning}</td>
            <td style="${td}">${item.r}</td>
            <td style="${td}">${item.discriminationMeaning}</td>
            <td style="${td};color:${pass ? 'green' : 'red'};font-weight:bold">${pass ? 'ใช้ได้' : 'ปรับปรุง'}</td>
          </tr>`;
        });
        html += `</table></body></html>`;

        const blob = new Blob(['\ufeff', html], { type: 'application/vnd.ms-excel' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href     = url;
        a.download = `ExamAnalysis_${meta.subjectCode || 'Result'}.xls`;
        a.click();
        URL.revokeObjectURL(url);
      };

      /* ════════════════ RENDER ════════════════ */
      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-100 to-indigo-50 py-8 px-4">

          {/* Toast */}
          {toast && (
            <div className={`fixed top-5 right-5 z-50 px-5 py-3 rounded-xl shadow-xl text-sm font-medium animate-fade-in
              ${toast.type === 'success' ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'}`}>
              {toast.msg}
            </div>
          )}

          <div className="max-w-7xl mx-auto">

            {/* ── HEADER ── */}
            <div className="bg-gradient-to-r from-indigo-700 to-violet-700 rounded-2xl p-7 text-white mb-6 shadow-lg">
              <div className="flex items-center gap-3 mb-1">
                <div className="bg-white/20 rounded-lg p-2"><Icon.Calculator /></div>
                <h1 className="text-2xl font-bold tracking-tight">ระบบวิเคราะห์ข้อสอบ (Item Analysis)</h1>
              </div>
              <p className="text-indigo-200 text-sm pl-1">
                วิเคราะห์ค่าความยากง่าย (p) · อำนาจจำแนก (r) · KR-20 · KR-21
              </p>
            </div>

            {/* ── METADATA FORM ── */}
            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6">
              <h2 className="text-sm font-semibold text-indigo-700 uppercase tracking-wider mb-4 flex items-center gap-2">
                <Icon.Settings /> ข้อมูลรายวิชา
              </h2>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                {[
                  { label: 'ชื่อวิชา', key: 'subjectName', placeholder: 'เช่น คณิตศาสตร์' },
                  { label: 'รหัสวิชา', key: 'subjectCode', placeholder: 'เช่น MATH101' },
                  { label: 'อาจารย์ผู้สอน', key: 'instructor', placeholder: 'ชื่อ-นามสกุล' },
                ].map(f => (
                  <div key={f.key}>
                    <label className="block text-xs font-medium text-gray-500 mb-1">{f.label}</label>
                    <input type="text" placeholder={f.placeholder}
                      className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 transition"
                      value={meta[f.key]}
                      onChange={e => setMeta({ ...meta, [f.key]: e.target.value })}
                    />
                  </div>
                ))}
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-xs font-medium text-gray-500 mb-1">ภาคเรียน</label>
                    <select className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                      value={meta.semester} onChange={e => setMeta({ ...meta, semester: e.target.value })}>
                      <option>1</option><option>2</option><option>3</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-gray-500 mb-1">ปีการศึกษา</label>
                    <input type="number"
                      className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                      value={meta.year} onChange={e => setMeta({ ...meta, year: e.target.value })}
                    />
                  </div>
                </div>
              </div>
            </div>

            {/* ── CONFIG ── */}
            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6">
              <h2 className="text-sm font-semibold text-indigo-700 uppercase tracking-wider mb-4 flex items-center gap-2">
                <Icon.Settings /> การตั้งค่าข้อสอบ
              </h2>
              <div className="flex flex-wrap gap-6 items-end">
                <div>
                  <label className="block text-xs font-medium text-gray-500 mb-1">จำนวนข้อสอบ</label>
                  <input type="number" min="1" max="100"
                    className="w-28 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                    value={config.numQuestions}
                    onChange={e => handleConfigChange('numQuestions', e.target.value)}
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-gray-500 mb-1">จำนวนตัวเลือก</label>
                  <input type="number" min="2" max="10"
                    className="w-28 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                    value={config.numChoices}
                    onChange={e => handleConfigChange('numChoices', e.target.value)}
                  />
                </div>
                <div className="text-xs text-gray-400 leading-relaxed">
                  <span className="inline-block bg-indigo-50 text-indigo-600 px-2 py-1 rounded-md font-medium">
                    {config.numQuestions} ข้อ · {config.numChoices} ตัวเลือก · {students.length} คน
                  </span>
                </div>
              </div>
            </div>

            {/* ── DATA TABLE ── */}
            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6 no-print">
              {/* Table Header Actions */}
              <div className="flex flex-wrap justify-between items-center mb-4 gap-3">
                <h2 className="text-sm font-semibold text-indigo-700 uppercase tracking-wider">
                  กรอกข้อมูลเฉลยและคำตอบ
                </h2>
                <div className="flex gap-2 flex-wrap">
                  <button onClick={exportToExcel} disabled={!results}
                    className={`flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium border transition-all
                      ${results
                        ? 'bg-emerald-500 text-white border-emerald-500 hover:bg-emerald-600 shadow-sm'
                        : 'bg-gray-50 text-gray-300 border-gray-200 cursor-not-allowed'}`}>
                    <Icon.Download /> ส่งออก Excel
                  </button>
                  <button onClick={() => setShowClearDialog(true)}
                    className="flex items-center gap-1.5 px-4 py-2 bg-red-50 text-red-600 border border-red-200 rounded-lg text-sm font-medium hover:bg-red-100 transition-all">
                    <Icon.Reset /> ล้างข้อมูล
                  </button>
                  <button onClick={calculateResults}
                    className="flex items-center gap-1.5 px-5 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700 shadow-md transition-all">
                    <Icon.Chart /> วิเคราะห์ข้อมูล
                  </button>
                </div>
              </div>

              {/* Table */}
              <div className="overflow-x-auto rounded-xl border border-gray-100">
                <table className="w-full text-sm border-collapse">
                  <thead>
                    <tr className="bg-gray-50 text-gray-500 text-xs uppercase">
                      <th className="px-3 py-3 text-left w-8 border-b border-gray-100">#</th>
                      <th className="px-3 py-3 text-left min-w-[180px] sticky left-0 bg-gray-50 z-10 shadow-r border-b border-gray-100">ชื่อ - นามสกุล</th>
                      {Array.from({ length: config.numQuestions }).map((_, i) => (
                        <th key={i} className="px-0.5 py-3 text-center min-w-[32px] border-b border-gray-100 border-l border-l-gray-100 font-semibold">
                          {i + 1}
                        </th>
                      ))}
                      <th className="px-3 py-3 text-center border-b border-gray-100">ลบ</th>
                    </tr>
                  </thead>
                  <tbody>
                    {/* Key Row */}
                    <tr className="bg-amber-50 border-b-2 border-indigo-200">
                      <td className="px-3 py-2.5 font-bold text-indigo-600 text-xs">KEY</td>
                      <td className="px-3 py-2.5 font-bold text-indigo-600 sticky left-0 bg-amber-50 z-10 shadow-r text-sm">
                        🔑 เฉลย
                      </td>
                      {keyAnswers.map((k, i) => (
                        <td key={i} className="p-0.5 border-l border-indigo-100">
                          <input type="text" maxLength={2}
                            className="w-full text-center py-1.5 border border-yellow-300 rounded-md bg-white focus:outline-none focus:border-indigo-400 font-bold text-indigo-700 text-sm"
                            value={k}
                            onChange={e => handleKeyChange(i, e.target.value)}
                          />
                        </td>
                      ))}
                      <td className="text-center text-gray-300 text-xs">—</td>
                    </tr>

                    {/* Student Rows */}
                    {students.map((s, sIdx) => (
                      <tr key={s.id} className="border-b border-gray-50 hover:bg-indigo-50/30 transition-colors">
                        <td className="px-3 py-2 text-gray-400 text-xs">{sIdx + 1}</td>
                        <td className="px-3 py-1.5 sticky left-0 bg-white z-10 shadow-r hover:bg-indigo-50/50">
                          <input type="text"
                            className="w-full border border-gray-200 rounded-md px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400"
                            value={s.name}
                            onChange={e => handleStudentChange(sIdx, 'name', e.target.value)}
                          />
                        </td>
                        {s.answers.map((ans, qIdx) => {
                          const hasKey = ans && keyAnswers[qIdx];
                          const correct = hasKey && ans.trim() === keyAnswers[qIdx].trim();
                          const wrong   = hasKey && !correct;
                          return (
                            <td key={qIdx} className="p-0.5 border-l border-gray-100">
                              <input type="text" maxLength={2}
                                className={`w-full text-center py-1.5 border rounded-md focus:outline-none focus:border-indigo-400 text-sm transition-colors ${
                                  results && correct ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
                                  results && wrong   ? 'bg-red-50 text-red-600 border-red-200' :
                                  'bg-white border-gray-200 text-gray-700'
                                }`}
                                value={ans}
                                onChange={e => handleStudentChange(sIdx, 'answer', e.target.value, qIdx)}
                              />
                            </td>
                          );
                        })}
                        <td className="text-center py-2">
                          <button onClick={() => removeStudentRow(sIdx)}
                            className="text-gray-300 hover:text-red-500 transition-colors p-1 rounded-md hover:bg-red-50 mx-auto flex">
                            <Icon.Trash />
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <button onClick={addStudentRow}
                className="mt-4 flex items-center gap-1.5 text-indigo-600 hover:text-indigo-800 text-sm font-medium hover:underline transition-colors">
                <Icon.Plus /> เพิ่มแถวนักเรียน
              </button>
            </div>

            {/* ── RESULTS ── */}
            {results && (
              <div id="results-section" className="bg-white rounded-2xl shadow-sm border border-indigo-100 p-7 animate-fade-in">
                <h2 className="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                  <span className="text-indigo-600"><Icon.Chart /></span>
                  ผลการวิเคราะห์ข้อมูล
                </h2>

                {/* Primary Stats */}
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-5">
                  <StatCard title="คะแนนเฉลี่ย (Mean)" value={results.basic.mean}
                    desc={`เต็ม ${results.basic.fullScore} คะแนน`} />
                  <StatCard title="SD" value={results.basic.sd} desc="ค่าเบี่ยงเบนมาตรฐาน" />
                  <StatCard title="KR-20" value={results.basic.kr20}
                    desc={parseFloat(results.basic.kr20) >= 0.7 ? "✓ ความเชื่อมั่นดี" : "ต่ำกว่าเกณฑ์"}
                    highlight={parseFloat(results.basic.kr20) >= 0.7} />
                  <StatCard title="KR-21" value={results.basic.kr21} desc="ค่าประมาณ KR-20" />
                </div>

                {/* Secondary Stats */}
                <div className="grid grid-cols-3 gap-4 mb-8">
                  {[
                    { label: 'คะแนนสูงสุด (Max)', value: results.basic.max, cls: 'text-emerald-600' },
                    { label: 'คะแนนต่ำสุด (Min)', value: results.basic.min, cls: 'text-red-500' },
                    { label: 'จำนวนนักเรียน (N)', value: `${results.basic.count} คน`, cls: 'text-indigo-600' },
                  ].map(c => (
                    <div key={c.label} className="bg-gray-50 border border-gray-100 rounded-xl p-4 text-center">
                      <div className="text-xs text-gray-400 mb-1">{c.label}</div>
                      <div className={`text-2xl font-bold ${c.cls}`}>{c.value}</div>
                    </div>
                  ))}
                </div>

                {/* Item Table */}
                <h3 className="text-base font-semibold text-gray-700 mb-3">วิเคราะห์รายข้อ (Item Analysis)</h3>
                <div className="overflow-x-auto rounded-xl border border-gray-100">
                  <table className="w-full text-sm">
                    <thead className="bg-indigo-50 text-indigo-800 text-xs uppercase">
                      <tr>
                        {['ข้อที่', 'ค่าความยาก (p)', 'ความหมาย', 'อำนาจจำแนก (r)', 'ความหมาย', 'สรุป'].map(h => (
                          <th key={h} className="px-5 py-3 text-center border-b border-indigo-100 font-semibold">{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {results.items.map((item, idx) => {
                        const pOk   = parseFloat(item.p) >= 0.2 && parseFloat(item.p) <= 0.8;
                        const rOk   = parseFloat(item.r) >= 0.2;
                        const pass  = pOk && rOk;
                        return (
                          <tr key={idx} className={`border-b border-gray-50 ${pass ? 'hover:bg-emerald-50/40' : 'hover:bg-red-50/30'} transition-colors`}>
                            <td className="px-5 py-3 text-center font-semibold text-gray-700">{item.id}</td>
                            <td className="px-5 py-3 text-center font-mono">{item.p}</td>
                            <td className="px-5 py-3 text-center">
                              <span className={`px-2.5 py-1 rounded-full text-xs font-medium
                                ${pOk ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>
                                {item.difficultyMeaning}
                              </span>
                            </td>
                            <td className="px-5 py-3 text-center font-mono">{item.r}</td>
                            <td className="px-5 py-3 text-center">
                              <span className={`px-2.5 py-1 rounded-full text-xs font-medium
                                ${rOk ? 'bg-blue-100 text-blue-700' : 'bg-red-100 text-red-600'}`}>
                                {item.discriminationMeaning}
                              </span>
                            </td>
                            <td className="px-5 py-3 text-center font-bold text-sm">
                              {pass
                                ? <span className="text-emerald-600">✓ ใช้ได้</span>
                                : <span className="text-red-500">✕ ปรับปรุง</span>}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>

                {/* Legend */}
                <div className="mt-5 flex flex-wrap gap-4 text-xs text-gray-500">
                  <span>📌 ค่าความยาก (p): 0.20 – 0.80 = ดี</span>
                  <span>📌 อำนาจจำแนก (r): ≥ 0.20 = ใช้ได้</span>
                  <span>📌 KR-20 ≥ 0.70 = ความเชื่อมั่นดี</span>
                </div>
              </div>
            )}
          </div>

          {/* ── CLEAR MODAL ── */}
          {showClearDialog && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl p-7 max-w-sm w-full animate-zoom-in">
                <div className="flex items-center gap-3 text-red-500 mb-4">
                  <Icon.Warn />
                  <h3 className="text-lg font-bold text-gray-800">ยืนยันการล้างข้อมูล</h3>
                </div>
                <p className="text-gray-600 text-sm mb-1">คุณแน่ใจหรือไม่ที่จะล้างคำตอบของนักเรียนทั้งหมด?</p>
                <p className="text-red-400 text-xs mb-6">* การกระทำนี้ไม่สามารถกู้คืนได้</p>
                <div className="flex justify-end gap-3">
                  <button onClick={() => setShowClearDialog(false)}
                    className="px-5 py-2.5 rounded-xl bg-gray-100 text-gray-700 text-sm font-medium hover:bg-gray-200 transition-colors">
                    ยกเลิก
                  </button>
                  <button onClick={confirmClear}
                    className="px-5 py-2.5 rounded-xl bg-red-600 text-white text-sm font-medium hover:bg-red-700 transition-colors shadow-sm">
                    ล้างข้อมูล
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    /* ── Mount ── */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
